<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; img-src 'self' blob: data:; media-src 'self' blob: mediastream:"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; img-src 'self' blob: data:; media-src 'self' blob: mediastream:"
    />
    <link rel="stylesheet" href="styles.css">
    <title>LabCS</title>
  </head>
  <body>
    <section class="header">
      <div>
        <h1>Explora modelo de <span class="h1_bold">Machine <br>Learning</span></h1>
        <p>Carga una imagen, utiliza tu cámara o dibuja para obtener una predicción instantánea.</p>
      </div>
      
      <ul class="box">
        <li id="catsdogs" class="active"><span class="model-dot cyan"></span>Perros & Gatos</li>
        <li id="mnist"><span class="model-dot violet"></span>MNIST</li>
      </ul>
    </section>

    <main>
      <section class="in box">
        <div class="in_header">
          <div class="in_header_title">
            <span>01 — Entrada</span>
            <h2>Selecciona una fuente</h2>
          </div>
        </div>

        <div class="in_main">
          <ul class="in_main_options">
            <li data-mode="upload" class="active">Subir imagen</li>
            <li data-mode="camera">Vista de cámara</li>
            <li data-mode="canvas">Canvas de dibujo</li>
          </ul>

          <div class="in_main_input">
            <button id="inputBtn">Cargar imagen</button>
            <img id="preview" alt="Vista previa" hidden>
            <video id="video" autoplay playsinline muted hidden></video>
            <canvas id="draw" width="280" height="280" hidden></canvas>
            <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/bmp" hidden>
          </div>

          <div class="in_main_actions" hidden>
            <button id="actionMain">Cargar imagen</button>
            <button id="actionAlt" class="ghost" hidden>Limpiar</button>
          </div>
        </div>
      </section>

      <section class="out box">
        <div class="out_header">
          <div class="out_header_title">
            <span>02 — Salida</span>
            <h2>Resultado del analisis</h2>
          </div>
          
          <div>
            <span class="out_header_live"><span class="model-dot green"></span>LIVE</span>
          </div>
        </div>

        <div class="out_result">
        </div>
      </section>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
